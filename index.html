<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teranga Palace — Gestion Hôtelière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- ======= ÉCRAN DE BIENVENUE (AJOUT — n'affecte aucune autre fonctionnalité) ======= -->
<div id="welcome-screen">
  <div class="welcome-inner">
    <p class="welcome-eyebrow">Bienvenue</p>
    <h1 class="welcome-title">Teranga Palace</h1>
    <div class="welcome-rule"></div>
    <p class="welcome-sub">Une expérience d'exception à Dakar</p>
  </div>
</div>
<script>
  // Supprime l'écran de bienvenue du DOM une fois l'animation terminée,
  // pour ne jamais gêner la navigation ou les fonctionnalités du site.
  window.addEventListener('load', function () {
    var ws = document.getElementById('welcome-screen');
    if (!ws) return;
    setTimeout(function () {
      ws.remove();
    }, 3600); // 2.6s d'affichage + 0.9s de fondu de sortie + marge
  });
</script>

<div id="app"></div>
<div id="toast-stack"></div>
<div id="modal-root"></div>
<div id="print-area" class="print-only"></div>

<script src="js/icons.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages-public.js"></script>
<script src="js/pages-admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
